[project]
name = "world-metta"
version = "0.1.0"
description = "Cross-cultural metta meditation generator using ElevenLabs voice conversion"
requires-python = ">=3.10"

dependencies = [
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "elevenlabs>=1.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metta_sdk"]
